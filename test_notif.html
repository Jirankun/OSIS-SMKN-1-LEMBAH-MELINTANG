<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Notification</title>
  <style>
    :root {
      --white: #ffffff;
      --gray-900: #0f172a;
      --gray-800: #1e293b;
      --gray-700: #334155;
      --gray-600: #475569;
      --gray-300: #cbd5e1;
      --gray-100: #f1f5f9;
      --primary: #3b82f6;
      --primary-dark: #2563eb;
      --accent: #f59e0b;
      --radius-lg: 12px;
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
      --transition: all 0.2s ease;
    }
    
    .notification-popup {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.95);
      width: 90%;
      max-width: 420px;
      background: var(--white);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      z-index: 10000;
      opacity: 0;
      transition: opacity 0.2s ease, transform 0.2s ease;
      overflow: hidden;
    }
    .notification-popup.show {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }
    .notification-popup__overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.6);
      z-index: 9999;
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    .notification-popup__overlay.show { opacity: 1; }
    
    .notification-popup__header {
      background: var(--gray-900);
      color: var(--white);
      padding: 1rem 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
    }
    .notification-popup__title {
      font-size: 0.95rem;
      font-weight: 700;
      margin: 0;
    }
    .notification-popup__close {
      background: transparent;
      color: var(--gray-300);
      border: none;
      font-size: 1.5rem;
      line-height: 1;
      cursor: pointer;
      padding: 0.2rem;
      border-radius: 6px;
      transition: var(--transition);
    }
    .notification-popup__close:hover {
      color: var(--white);
      background: rgba(255,255,255,0.1);
    }
    
    .notification-popup__body {
      padding: 1.25rem;
      color: var(--gray-800);
      font-size: 0.9rem;
      line-height: 1.5;
    }
    .notification-popup__body p { margin: 0; }
    
    .notification-popup__footer {
      padding: 0.75rem 1.25rem 1.25rem;
      display: flex;
      justify-content: flex-end;
      gap: 0.5rem;
    }
    .btn-popup {
      padding: 0.5rem 1.2rem;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      border: none;
    }
    .btn-popup--primary {
      background: var(--primary);
      color: var(--white);
    }
    .btn-popup--primary:hover {
      background: var(--primary-dark);
      transform: translateY(-1px);
    }
    .btn-popup--ghost {
      background: transparent;
      color: var(--gray-600);
      border: 1.5px solid var(--gray-300);
    }
    .btn-popup--ghost:hover {
      background: var(--gray-100);
      color: var(--gray-800);
    }
    
    .notification-popup--info { border-top: 4px solid var(--primary); }
    .notification-popup--warning { border-top: 4px solid var(--accent); }
  </style>
</head>
<body>
  <h1>Test Notification Popup</h1>
  <p>Popup akan muncul dalam 1 detik...</p>
  
  <div id="notification-popup" class="notification-popup" style="display:none" role="dialog" aria-modal="true"></div>

  <script>
    async function initNotificationPopup() {
      const popupContainer = document.getElementById('notification-popup');
      if (!popupContainer) {
        return;
      }
      
      try {
        const res = await fetch('content/notifications.json');
        if (!res.ok) {
          throw new Error('File not found: ' + res.status + ' ' + res.statusText);
        }
        const notifications = await res.json();
        
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        
        const activeNotif = notifications.find(n => {
          if (!n.active) {
            return false;
          }
          const fromDate = new Date(n.show_from);
          const untilDate = new Date(n.show_until);
          fromDate.setHours(0, 0, 0, 0);
          untilDate.setHours(23, 59, 59, 999);
          
          const isActive = today >= fromDate && today <= untilDate;
          return isActive;
        });
        
        if (!activeNotif) {
          console.log('No active notification');
          return;
        }
        
        // Cek localStorage: udah ditutup belum?
        const version = activeNotif.version || 1;
        const sanitizedTitle = activeNotif.title.replace(/[^a-zA-Z0-9]/g, '_');
        const dismissedKey = 'notif_' + sanitizedTitle + '_v' + version;
        
        if (localStorage.getItem(dismissedKey)) {
          console.log('Notification already dismissed');
          return;
        }
        
        // Render popup
        const hasAction = activeNotif.has_action && activeNotif.link;
        const linkUrl = activeNotif.link || '#';
        const linkText = activeNotif.link_text || 'Lihat Detail';
        
        popupContainer.innerHTML = 
          '<div class="notification-popup__overlay" id="notif-overlay"></div>' +
          '<div class="notification-popup notification-popup--' + activeNotif.type + '">' +
            '<div class="notification-popup__header">' +
              '<h3 class="notification-popup__title">' + escapeHtml(activeNotif.title) + '</h3>' +
              '<button class="notification-popup__close" aria-label="Tutup">&times;</button>' +
            '</div>' +
            '<div class="notification-popup__body">' +
              '<p>' + escapeHtml(activeNotif.message) + '</p>' +
            '</div>' +
            '<div class="notification-popup__footer">' +
              (hasAction ? '<a href="' + escapeHtml(linkUrl) + '" class="btn-popup btn-popup--primary">' + escapeHtml(linkText) + '</a>' : '') +
              '<button class="btn-popup btn-popup--ghost">Tutup</button>' +
            '</div>' +
          '</div>';
        
        // Show dengan animasi
        requestAnimationFrame(function() {
          popupContainer.style.display = 'block';
          setTimeout(function() {
            var notifEl = popupContainer.querySelector('.notification-popup');
            var overlayEl = popupContainer.querySelector('.notification-popup__overlay');
            if (notifEl) notifEl.classList.add('show');
            if (overlayEl) overlayEl.classList.add('show');
          }, 10);
        });
        
        // Close logic
        var closePopup = function() {
          localStorage.setItem(dismissedKey, 'true');
          
          var notifEl = popupContainer.querySelector('.notification-popup');
          var overlayEl = popupContainer.querySelector('.notification-popup__overlay');
          
          if (notifEl) notifEl.classList.remove('show');
          if (overlayEl) overlayEl.classList.remove('show');
          
          setTimeout(function() {
            popupContainer.style.display = 'none';
          }, 200);
          
          // Remove ESC listener
          document.removeEventListener('keydown', onEscHandler);
        };
        
        var onEscHandler = function(e) {
          if (e.key === 'Escape') {
            closePopup();
          }
        };
        
        // Bind event listeners
        setTimeout(function() {
          var closeBtn = popupContainer.querySelector('.notification-popup__close');
          var ghostBtn = popupContainer.querySelector('.btn-popup--ghost');
          var overlay = popupContainer.querySelector('.notification-popup__overlay');
          
          if (closeBtn) {
            closeBtn.addEventListener('click', closePopup);
          }
          if (ghostBtn) {
            ghostBtn.addEventListener('click', closePopup);
          }
          if (overlay) {
            overlay.addEventListener('click', closePopup);
          }
          
          // Close pake ESC
          document.addEventListener('keydown', onEscHandler);
        }, 50);
        
      } catch (e) {
        console.error('Error loading notification:', e);
      }
    }
    
    function escapeHtml(text) {
      if (!text) return '';
      var div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
    
    // Init after 1 second
    setTimeout(initNotificationPopup, 1000);
  </script>
</body>
</html>
