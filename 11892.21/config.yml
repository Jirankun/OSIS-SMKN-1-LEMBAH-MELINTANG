backend:
  name: github
  repo: Jirankun/OSIS-SMKN-1-LEMBAH-MELINTANG
  branch: main
  base_url: https://old-rain-91e1.tkjtogetherness.workers.dev
  local_backend: false

# ============================================
# KONFIGURASI MEDIA & GAMBAR
# ============================================
media_folder: "img"
public_folder: "/img"

# ============================================
# KOLEKSI POSTS (Berita, Pengumuman, Agenda)
# ============================================
collections:
  - name: "posts"
    label: "📰 Artikel & Pengumuman"
    folder: "post"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{title}}"
    format: "frontmatter"
    extension: "md"
    media_folder: "/img/post"
    public_folder: "/img/post"
    fields:
      - label: "📝 Judul Artikel"
        name: "title"
        widget: "string"
        required: true
        hint: "Masukkan judul yang menarik dan deskriptif"
      - label: "🏷️ Tipe Konten"
        name: "type"
        widget: "select"
        options: ["berita", "pengumuman", "agenda"]
        default: "berita"
        required: true
        hint: "Pilih kategori konten"
      - label: "📅 Tanggal Publikasi"
        name: "date"
        widget: "datetime"
        format: "YYYY-MM-DD"
        time_format: false
        required: true
      - label: "✍️ Penulis"
        name: "author"
        widget: "string"
        required: true
        hint: "Nama penulis atau divisi"
      - label: "🖼️ Thumbnail Gambar"
        name: "image"
        widget: "image"
        required: false
        hint: "Unggah gambar thumbnail untuk artikel ini (opsional)"
      - label: "📄 Isi Konten"
        name: "body"
        widget: "markdown"
        required: true
        hint: "Tulis konten lengkap artikel di sini"

  # ============================================
  # GALERI KEGIATAN
  # ============================================
  - name: "galeri"
    label: "📸 Galeri Kegiatan"
    files:
      - label: "Daftar Foto Kegiatan"
        name: "galeri_file"
        file: "content/galeri.json"
        format: "json"
        media_folder: "/img/galeri"
        public_folder: "/img/galeri"
        fields:
          - label: "Foto-foto Kegiatan"
            name: "galeri"
            widget: "list"
            collapsed: false
            fields:
              - label: "📷 Judul Foto"
                name: "title"
                widget: "string"
                required: true
                hint: "Judul atau nama kegiatan pada foto"
              - label: "📅 Tanggal Kegiatan"
                name: "date"
                widget: "datetime"
                format: "YYYY-MM-DD"
                time_format: false
                required: true
              - label: "📝 Keterangan Foto"
                name: "description"
                widget: "string"
                required: false
                hint: "Deskripsi singkat tentang foto (opsional)"
              - label: "🖼️ Upload Foto"
                name: "image"
                widget: "image"
                required: true
                hint: "Pilih file gambar dari komputer"

  # ============================================
  # PENGURUS INTI OSIS
  # ============================================
  - name: "pengurus_inti"
    label: "👑 Pengurus Inti OSIS"
    files:
      - label: "Data Pengurus Inti"
        name: "pengurus_inti_file"
        file: "content/team_1.json"
        format: "json"
        media_folder: "/img/pengurus/inti"
        public_folder: "/img/pengurus/inti"
        fields:
          - label: "Daftar Pengurus Inti"
            name: "team"
            widget: "list"
            collapsed: false
            fields:
              - label: "👤 Nama Lengkap"
                name: "name"
                widget: "string"
                required: true
              - label: "🎯 Jabatan"
                name: "role"
                widget: "string"
                required: true
                hint: "Contoh: Ketua, Wakil Ketua, Sekretaris, Bendahara"
              - label: "📸 Foto Profil"
                name: "image"
                widget: "image"
                required: true
                hint: "Foto profil resmi dengan latar belakang rapi"

  # ============================================
  # STRUKTUR DIVISI OSIS
  # ============================================
  - name: "pengurus_divisi"
    label: "🏢 Struktur Divisi OSIS"
    files:
      - label: "Data Divisi dan Anggota"
        name: "pengurus_divisi_file"
        file: "content/team_2.json"
        format: "json"
        media_folder: "/img/pengurus/divisi"
        public_folder: "/img/pengurus/divisi"
        fields:
          - label: "Daftar Divisi"
            name: "divisions"
            widget: "list"
            collapsed: false
            fields:
              - label: "🏷️ Nama Divisi"
                name: "division"
                widget: "string"
                required: true
                hint: "Contoh: Divisi Humas, Divisi Olahraga, dll."
              - label: "👥 Anggota Divisi"
                name: "members"
                widget: "list"
                collapsed: false
                fields:
                  - label: "👤 Nama Anggota"
                    name: "name"
                    widget: "string"
                    required: true
                  - label: "📸 Foto Anggota"
                    name: "image"
                    widget: "image"
                    required: false
                    hint: "Foto profil anggota (opsional)"
