<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Twibbon SMKN 1 LEMBAH MELINTANG</title>
    <meta name="description" content="Aplikasi Twibbon SMKN 1 Lembah Melintang">
    <meta name="author" content="Zhyllan Fyllah (Jirankun)">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Hammer.js untuk Pinch-to-Zoom -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/hammer.js/2.0.8/hammer.min.js"></script>
    
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        'poppins': ['Poppins', 'sans-serif'],
                    },
                    animation: {
                        'gradient': 'gradient 15s ease infinite',
                    },
                    keyframes: {
                        gradient: {
                            '0%, 100%': { 'background-position': '0% 50%' },
                            '50%': { 'background-position': '100% 50%' },
                        }
                    }
                }
            }
        }
    </script>
    
    <style>
        * {
            font-family: 'Poppins', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            background: linear-gradient(-45deg, #0f172a, #1e1b4b, #312e81, #1e293b);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
            min-height: 100vh;
        }
        
        .glass-effect {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .canvas-wrapper {
            position: relative;
            border-radius: 1rem;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            background: #0f172a;
        }
        
        canvas {
            cursor: grab;
            touch-action: none;
            max-width: 100%;
            height: auto;
            display: block;
        }
        
        canvas:active {
            cursor: grabbing;
        }
        
        .file-input-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
            width: 100%;
        }
        
        .file-input-wrapper input[type=file] {
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }
        
        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(15, 23, 42, 0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 50;
        }
        
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid #3b82f6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>

<body class="text-white">
    <!-- Main Content -->
    <main class="container mx-auto px-4 py-6 max-w-md">
        
        <!-- Title -->
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold bg-gradient-to-r from-blue-400 to-purple-400 bg-clip-text text-transparent mb-2">
                Twibbon SMKN 1 LEMBAH MELINTANG
            </h1>
            <p class="text-xs text-gray-400">Selamat Datang Peserta Didik Baru</p>
        </div>

        <!-- Canvas Preview -->
        <div class="glass-effect rounded-2xl p-4 mb-6">
            <div class="canvas-wrapper bg-slate-900 aspect-square">
                <canvas id="canvas"></canvas>
                <div id="loadingOverlay" class="loading-overlay hidden">
                    <div class="text-center">
                        <div class="spinner mx-auto mb-3"></div>
                        <p class="text-gray-400 text-sm">Memuat...</p>
                    </div>
                </div>
            </div>
            <p class="text-xs text-gray-500 mt-3 text-center">
                <i class="fas fa-hand-pointer text-blue-400"></i> Sentuh & geser untuk mengatur posisi
            </p>
        </div>

        <!-- Upload Button -->
        <div class="glass-effect rounded-2xl p-4 mb-4">
            <div class="file-input-wrapper">
                <button class="w-full py-4 px-6 bg-gradient-to-r from-blue-500 to-purple-600 hover:from-blue-600 hover:to-purple-700 rounded-xl font-semibold transition-all duration-300 flex items-center justify-center gap-2 shadow-lg">
                    <i class="fas fa-camera"></i>
                    <span>Unggah Foto</span>
                </button>
                <input type="file" id="imageUpload" accept="image/*">
            </div>
        </div>

        <!-- Download Button -->
        <div class="glass-effect rounded-2xl p-4 mb-6">
            <button id="saveImage" class="w-full py-4 px-6 bg-gradient-to-r from-green-500 to-emerald-600 hover:from-green-600 hover:to-emerald-700 rounded-xl font-semibold transition-all duration-300 flex items-center justify-center gap-2 shadow-lg">
                <i class="fas fa-download"></i>
                <span>Unduh Twibbon</span>
            </button>
        </div>

        <!-- Footer -->
        <footer class="text-center pb-6">
            <p class="text-gray-500 text-xs">
                © 2024 Twibbon SMKN 1 LEMBAH MELINTANG
            </p>
            <p class="text-gray-600 text-xs mt-1">
                Developed by <strong class="text-blue-400">Zhyllan Fyllah (Jirankun)</strong>
            </p>
        </footer>

    </main>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    
    <!-- Main JavaScript -->
    <script>
        // Variabel Global
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const image = new Image();
        const twibbon = new Image();
        let scale = 1;
        let position = { x: 0, y: 0 };
        let dragStart = null;
        let isDragging = false;
        let hasImage = false;

        // Loading Overlay
        function showLoading(show) {
            const overlay = document.getElementById('loadingOverlay');
            if (show) {
                overlay.classList.remove('hidden');
            } else {
                overlay.classList.add('hidden');
            }
        }

        // Load Twibbon Frame
        twibbon.src = 'twibbon.png';
        twibbon.onload = function() {
            resizeCanvas();
            draw();
        };
        twibbon.onerror = function() {
            Swal.fire({
                icon: 'error',
                title: 'Oops...',
                text: 'File twibbon.png tidak ditemukan!',
                background: 'rgba(30, 41, 59, 0.95)',
                color: '#fff',
                confirmButtonColor: '#3b82f6'
            });
        };

        // Handle Upload Foto
        $('#imageUpload').change(function(e) {
            const file = e.target.files[0];
            if (!file) return;

            if (!file.type.startsWith('image/')) {
                Swal.fire({
                    icon: 'warning',
                    title: 'File Tidak Valid',
                    text: 'Mohon unggah file gambar',
                    background: 'rgba(30, 41, 59, 0.95)',
                    color: '#fff',
                    confirmButtonColor: '#f59e0b'
                });
                return;
            }

            showLoading(true);

            const reader = new FileReader();
            reader.onload = function(event) {
                image.src = event.target.result;
                image.onload = function() {
                    hasImage = true;
                    reset();
                    draw();
                    showLoading(false);
                    
                    Swal.fire({
                        icon: 'success',
                        title: 'Foto Berhasil!',
                        text: 'Geser & cubit untuk mengatur',
                        timer: 1500,
                        showConfirmButton: false,
                        background: 'rgba(30, 41, 59, 0.95)',
                        color: '#fff'
                    });
                };
            };
            reader.readAsDataURL(file);
        });

        // Reset Posisi
        function reset() {
            scale = 1;
            position = { x: 0, y: 0 };
        }

        // Draw Function
        function draw() {
            const cw = canvas.width;
            const ch = canvas.height;

            // Clear canvas dengan background hitam
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(0, 0, cw, ch);

            // Jika ada foto, gambar foto
            if (hasImage && image.src && image.src !== window.location.href) {
                const iw = image.width;
                const ih = image.height;
                const scaleFactor = Math.min(cw / iw, ch / ih);
                
                ctx.save();
                ctx.translate(cw / 2, ch / 2);
                ctx.scale(scaleFactor * scale, scaleFactor * scale);
                ctx.translate(-iw / 2 + position.x / (scaleFactor * scale), 
                             -ih / 2 + position.y / (scaleFactor * scale));
                ctx.drawImage(image, 0, 0);
                ctx.restore();
            } else {
                // Tampilkan placeholder jika belum ada foto
                ctx.fillStyle = '#1e293b';
                ctx.fillRect(0, 0, cw, ch);
                
                ctx.fillStyle = '#475569';
                ctx.font = '20px Poppins';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('Upload Foto Anda', cw / 2, ch / 2 - 30);
                
                ctx.font = '14px Poppins';
                ctx.fillStyle = '#64748b';
                ctx.fillText('Klik tombol di bawah', cw / 2, ch / 2 + 10);
            }
            
            // Selalu gambar twibbon overlay
            ctx.drawImage(twibbon, 0, 0, cw, ch);
        }

        // Resize Canvas
        function resizeCanvas() {
            canvas.width = twibbon.width;
            canvas.height = twibbon.height;
            draw();
        }

        // Touch & Mouse Events
        function getEventPos(evt) {
            const rect = canvas.getBoundingClientRect();
            if (evt.touches && evt.touches.length > 0) {
                return {
                    x: evt.touches[0].clientX - rect.left,
                    y: evt.touches[0].clientY - rect.top
                };
            }
            return {
                x: evt.clientX - rect.left,
                y: evt.clientY - rect.top
            };
        }

        function startDrag(evt) {
            if (!hasImage) return;
            isDragging = true;
            const pos = getEventPos(evt);
            dragStart = { 
                x: pos.x - position.x, 
                y: pos.y - position.y 
            };
            canvas.style.cursor = 'grabbing';
        }

        function doDrag(evt) {
            if (!isDragging || !dragStart || !hasImage) return;
            evt.preventDefault();
            const pos = getEventPos(evt);
            position.x = pos.x - dragStart.x;
            position.y = pos.y - dragStart.y;
            draw();
        }

        function endDrag() {
            isDragging = false;
            dragStart = null;
            canvas.style.cursor = 'grab';
        }

        // Mouse Events
        canvas.addEventListener('mousedown', startDrag);
        canvas.addEventListener('mousemove', doDrag);
        canvas.addEventListener('mouseup', endDrag);
        canvas.addEventListener('mouseleave', endDrag);

        // Touch Events
        canvas.addEventListener('touchstart', startDrag, { passive: false });
        canvas.addEventListener('touchmove', doDrag, { passive: false });
        canvas.addEventListener('touchend', endDrag);

        // Hammer.js untuk Pinch-to-Zoom
        const hammer = new Hammer(canvas);
        hammer.get('pinch').set({ enable: true });
        
        let initialScale = 1;
        
        hammer.on('pinchstart', function(evt) {
            if (!hasImage) return;
            initialScale = scale;
        });
        
        hammer.on('pinchmove', function(evt) {
            if (!hasImage) return;
            evt.preventDefault();
            scale = Math.max(0.1, Math.min(3, initialScale * evt.scale));
            draw();
        });

        // Download Button
        document.getElementById('saveImage').addEventListener('click', function() {
            if (!hasImage) {
                Swal.fire({
                    icon: 'warning',
                    title: 'Belum Ada Foto',
                    text: 'Silakan unggah foto terlebih dahulu',
                    background: 'rgba(30, 41, 59, 0.95)',
                    color: '#fff',
                    confirmButtonColor: '#f59e0b'
                });
                return;
            }

            const dataURL = canvas.toDataURL('image/png');
            const link = document.createElement('a');
            link.download = 'twibbon-smkn1-lm.png';
            link.href = dataURL;
            link.click();
            
            Swal.fire({
                icon: 'success',
                title: 'Berhasil!',
                text: 'Twibbon telah diunduh',
                timer: 1500,
                showConfirmButton: false,
                background: 'rgba(30, 41, 59, 0.95)',
                color: '#fff'
            });
        });

        // Initialize
        resizeCanvas();
        canvas.style.cursor = 'grab';
    </script>
</body>
</html>
