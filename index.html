<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Twibbon SMKN 1 LEMBAH MELINTANG</title>
    <meta name="description" content="Aplikasi Twibbon SMKN 1 Lembah Melintang">
    <meta name="author" content="Zhyllan Fyllah (Jirankun)">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Hammer.js untuk Pinch-to-Zoom -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/hammer.js/2.0.8/hammer.min.js"></script>
    
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        'poppins': ['Poppins', 'sans-serif'],
                    },
                    animation: {
                        'gradient': 'gradient 15s ease infinite',
                        'flash': 'flash 0.3s ease-out',
                    },
                    keyframes: {
                        gradient: {
                            '0%, 100%': { 'background-position': '0% 50%' },
                            '50%': { 'background-position': '100% 50%' },
                        },
                        flash: {
                            '0%': { opacity: '1' },
                            '100%': { opacity: '0' },
                        }
                    }
                }
            }
        }
    </script>
    
    <style>
        /* LOCK SCROLL BIAR BERASA NATIVE APP ANJIR */
        html, body {
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            touch-action: none;
            -webkit-overflow-scrolling: touch;
        }
        
        * {
            font-family: 'Poppins', sans-serif;
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
        }
        
        body {
            background: linear-gradient(-45deg, #0f172a, #1e1b4b, #312e81, #1e293b);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        .glass-effect {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .canvas-wrapper {
            position: relative;
            border-radius: 1rem;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            background: #0f172a;
            width: 100%;
            max-width: 400px;
            aspect-ratio: 1 / 1;
        }
        
        canvas {
            cursor: grab;
            touch-action: none;
            width: 100%;
            height: 100%;
            display: block;
        }
        
        canvas:active {
            cursor: grabbing;
        }
        
        /* CUSTOM DRAWER STYLES */
        .drawer-overlay {
            transition: opacity 0.3s ease;
        }
        
        .drawer-content {
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .drawer-open .drawer-overlay {
            opacity: 1;
            pointer-events: auto;
        }
        
        .drawer-open .drawer-content {
            transform: translateY(0);
        }
        
        /* CUSTOM CAMERA UI */
        #cameraModal {
            transition: opacity 0.3s ease;
        }
        
        #cameraFeed {
            object-fit: cover;
            width: 100%;
            height: 100%;
        }
        
        .shutter-btn {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: white;
            border: 4px solid rgba(255,255,255,0.3);
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            transition: transform 0.1s;
        }
        
        .shutter-btn:active {
            transform: scale(0.9);
            background: #e2e8f0;
        }
        
        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(15, 23, 42, 0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 50;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top: 3px solid #3b82f6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* DISABLED BUTTON STATE */
        .btn-disabled {
            opacity: 0.5;
            cursor: not-allowed;
            filter: grayscale(100%);
        }
    </style>
</head>

<body class="text-white">
    <!-- Main Content -->
    <main class="w-full max-w-md px-4 py-6 flex flex-col items-center justify-between h-full">
        
        <!-- Title -->
        <div class="text-center mb-4">
            <h1 class="text-2xl font-bold bg-gradient-to-r from-blue-400 to-purple-400 bg-clip-text text-transparent mb-1">
                SMKN 1 LEMBAH MELINTANG
            </h1>
            <p class="text-xs text-gray-400">Selamat Datang</p>
        </div>

        <!-- Canvas Preview -->
        <div class="glass-effect rounded-2xl p-3 w-full">
            <div class="canvas-wrapper bg-slate-900 mx-auto">
                <canvas id="canvas"></canvas>
                <div id="loadingOverlay" class="loading-overlay hidden">
                    <div class="text-center">
                        <div class="spinner mx-auto mb-2"></div>
                        <p class="text-gray-400 text-xs">Memproses...</p>
                    </div>
                </div>
            </div>
            <p class="text-xs text-gray-500 mt-2 text-center">
                <i class="fas fa-hand-pointer text-blue-400"></i> Sentuh & geser untuk mengatur posisi
            </p>
        </div>

        <!-- Action Buttons -->
        <div class="w-full mt-4 space-y-3 mb-6">
            <!-- Tombol Buat/Ubah Foto -->
            <button id="mainActionBtn" class="w-full py-4 px-6 bg-gradient-to-r from-blue-500 to-purple-600 hover:from-blue-600 hover:to-purple-700 rounded-xl font-semibold transition-all duration-300 flex items-center justify-center gap-2 shadow-lg active:scale-95">
                <i class="fas fa-magic"></i>
                <span id="mainBtnText">Buat Twibbon Saya</span>
            </button>

            <!-- Tombol Download (BARU BRE!) -->
            <button id="downloadBtn" class="w-full py-4 px-6 bg-gradient-to-r from-green-500 to-emerald-600 hover:from-green-600 hover:to-emerald-700 rounded-xl font-semibold transition-all duration-300 flex items-center justify-center gap-2 shadow-lg active:scale-95 btn-disabled" disabled>
                <i class="fas fa-download"></i>
                <span>Unduh Twibbon</span>
            </button>
        </div>

        <!-- Footer -->
        <footer class="text-center pb-2">
            <p class="text-gray-600 text-xs">
                Developed by <strong class="text-blue-400">Zhyllan Fyllah (Jirankun)</strong>
            </p>
        </footer>
    </main>

    <!-- HIDDEN FILE INPUT -->
    <input type="file" id="fileInput" accept="image/*" class="hidden">

    <!-- CUSTOM BOTTOM DRAWER -->
    <div id="actionDrawer" class="fixed inset-0 z-50 hidden">
        <div class="drawer-overlay absolute inset-0 bg-black/60 backdrop-blur-sm opacity-0 pointer-events-none" onclick="closeDrawer()"></div>
        <div class="drawer-content absolute bottom-0 left-0 right-0 bg-slate-800 rounded-t-3xl p-6 transform translate-y-full border-t border-white/10 shadow-2xl">
            <div class="w-12 h-1.5 bg-gray-600 rounded-full mx-auto mb-6"></div>
            
            <h3 class="text-lg font-semibold text-center mb-6 text-white">Pilih Sumber Foto</h3>
            
            <div class="space-y-3">
                <button id="btnTakePhoto" class="w-full py-4 bg-gradient-to-r from-blue-500 to-blue-600 rounded-xl font-medium flex items-center justify-center gap-3 text-white shadow-lg active:scale-95 transition">
                    <i class="fas fa-camera text-xl"></i>
                    <span>Ambil Gambar</span>
                </button>
                
                <button id="btnPickPhoto" class="w-full py-4 bg-gradient-to-r from-purple-500 to-purple-600 rounded-xl font-medium flex items-center justify-center gap-3 text-white shadow-lg active:scale-95 transition">
                    <i class="fas fa-image text-xl"></i>
                    <span>Pilih Foto</span>
                </button>
                
                <button onclick="closeDrawer()" class="w-full py-4 bg-slate-700 hover:bg-slate-600 rounded-xl font-medium flex items-center justify-center gap-3 text-gray-300 active:scale-95 transition">
                    <i class="fas fa-times text-xl"></i>
                    <span>Batal</span>
                </button>
            </div>
        </div>
    </div>

    <!-- CUSTOM CAMERA UI -->
    <div id="cameraModal" class="fixed inset-0 z-[60] hidden bg-black opacity-0 pointer-events-none">
        <div class="relative w-full h-full">
            <video id="cameraFeed" autoplay playsinline class="w-full h-full"></video>
            
            <!-- Flash Effect -->
            <div id="flashEffect" class="absolute inset-0 bg-white opacity-0 pointer-events-none"></div>
            
            <!-- Top Bar -->
            <div class="absolute top-0 left-0 right-0 p-4 flex justify-between items-center bg-gradient-to-b from-black/70 to-transparent">
                <button id="closeCamera" class="w-10 h-10 rounded-full bg-black/50 backdrop-blur flex items-center justify-center text-white text-xl active:scale-90 transition">
                    <i class="fas fa-times"></i>
                </button>
                <span class="text-white font-medium text-sm">Kamera</span>
                <div class="w-10"></div>
            </div>
            
            <!-- Bottom Controls -->
            <div class="absolute bottom-0 left-0 right-0 p-8 flex justify-center items-center bg-gradient-to-t from-black/70 to-transparent">
                <button id="shutterBtn" class="shutter-btn active:scale-90"></button>
            </div>
        </div>
    </div>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    
    <!-- Main JavaScript -->
    <script>
        // Variabel Global
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const image = new Image();
        const twibbon = new Image();
        let scale = 1;
        let position = { x: 0, y: 0 };
        let dragStart = null;
        let isDragging = false;
        let hasImage = false;

        // Camera Variables
        let cameraStream = null;
        const videoElement = document.getElementById('cameraFeed');
        const captureCanvas = document.createElement('canvas');

        // DOM Elements
        const downloadBtn = document.getElementById('downloadBtn');
        const mainBtnText = document.getElementById('mainBtnText');

        // Loading Overlay
        function showLoading(show) {
            const overlay = document.getElementById('loadingOverlay');
            if (show) overlay.classList.remove('hidden');
            else overlay.classList.add('hidden');
        }

        // Update UI State (Enable/Disable Download Button)
        function updateUIState() {
            if (hasImage) {
                downloadBtn.disabled = false;
                downloadBtn.classList.remove('btn-disabled');
                mainBtnText.textContent = 'Ubah Foto';
            } else {
                downloadBtn.disabled = true;
                downloadBtn.classList.add('btn-disabled');
                mainBtnText.textContent = 'Buat Twibbon Saya';
            }
        }

        // Load Twibbon Frame
        twibbon.src = 'twibbon.png';
        twibbon.onload = function() {
            resizeCanvas();
            draw();
        };
        twibbon.onerror = function() {
            Swal.fire({
                icon: 'error',
                title: 'Oops...',
                text: 'File twibbon.png tidak ditemukan!',
                background: 'rgba(30, 41, 59, 0.95)',
                color: '#fff',
                confirmButtonColor: '#3b82f6'
            });
        };

        // DRAWER FUNCTIONS
        function openDrawer() {
            const drawer = document.getElementById('actionDrawer');
            drawer.classList.remove('hidden');
            void drawer.offsetWidth;
            drawer.classList.add('drawer-open');
        }

        function closeDrawer() {
            const drawer = document.getElementById('actionDrawer');
            drawer.classList.remove('drawer-open');
            setTimeout(() => {
                drawer.classList.add('hidden');
            }, 300);
        }

        // Main Action Button
        document.getElementById('mainActionBtn').addEventListener('click', openDrawer);

        // Pick Photo
        document.getElementById('btnPickPhoto').addEventListener('click', () => {
            closeDrawer();
            setTimeout(() => {
                document.getElementById('fileInput').click();
            }, 300);
        });

        // File Input Handler
        document.getElementById('fileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            if (!file.type.startsWith('image/')) {
                Swal.fire({ icon: 'warning', title: 'File Tidak Valid', text: 'Mohon unggah file gambar', background: 'rgba(30, 41, 59, 0.95)', color: '#fff', confirmButtonColor: '#f59e0b' });
                return;
            }

            showLoading(true);
            const reader = new FileReader();
            reader.onload = function(event) {
                processImage(event.target.result);
            };
            reader.readAsDataURL(file);
            // Reset input value so same file can be selected again
            this.value = '';
        });

        // CAMERA PERMISSION CHECK & OPEN
        async function checkAndOpenCamera() {
            closeDrawer();
            
            const loadingToast = Swal.fire({
                title: 'Memeriksa izin kamera...',
                allowOutsideClick: false,
                allowEscapeKey: false,
                showConfirmButton: false,
                background: 'rgba(30, 41, 59, 0.95)',
                color: '#fff',
                didOpen: () => { Swal.showLoading(); }
            });

            try {
                if (navigator.permissions) {
                    try {
                        const permissionStatus = await navigator.permissions.query({ name: 'camera' });
                        if (permissionStatus.state === 'denied') {
                            loadingToast.close();
                            Swal.fire({
                                icon: 'error', title: 'Izin Kamera Ditolak',
                                html: 'Anda telah menolak akses kamera.<br>Silakan buka pengaturan browser untuk mengizinkan.',
                                confirmButtonText: 'Mengerti', background: 'rgba(30, 41, 59, 0.95)', color: '#fff', confirmButtonColor: '#ef4444'
                            });
                            return;
                        }
                        await requestCameraAccess(loadingToast);
                    } catch (permError) {
                        await requestCameraAccess(loadingToast);
                    }
                } else {
                    await requestCameraAccess(loadingToast);
                }
            } catch (err) {
                loadingToast.close();
                Swal.fire({
                    icon: 'error', title: 'Gagal Mengakses Kamera',
                    html: 'Pastikan:<br>1. Browser mendukung kamera<br>2. Gunakan HTTPS atau localhost<br>3. Perangkat memiliki kamera',
                    confirmButtonText: 'Mengerti', background: 'rgba(30, 41, 59, 0.95)', color: '#fff', confirmButtonColor: '#ef4444'
                });
            }
        }

        async function requestCameraAccess(loadingToast) {
            try {
                cameraStream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 1280 } },
                    audio: false
                });
                loadingToast.close();
                openCameraUI();
            } catch (err) {
                loadingToast.close();
                if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
                    Swal.fire({
                        icon: 'warning', title: 'Izin Kamera Diperlukan',
                        html: 'Aplikasi ini memerlukan akses kamera.<br>Silakan izinkan saat browser meminta.',
                        confirmButtonText: 'Coba Lagi', cancelButtonText: 'Batal', showCancelButton: true,
                        background: 'rgba(30, 41, 59, 0.95)', color: '#fff', confirmButtonColor: '#3b82f6', cancelButtonColor: '#6b7280'
                    }).then((result) => { if (result.isConfirmed) checkAndOpenCamera(); });
                } else if (err.name === 'NotFoundError' || err.name === 'DevicesNotFoundError') {
                    Swal.fire({ icon: 'error', title: 'Kamera Tidak Ditemukan', text: 'Perangkat tidak memiliki kamera.', background: 'rgba(30, 41, 59, 0.95)', color: '#fff', confirmButtonColor: '#ef4444' });
                } else if (err.name === 'NotReadableError' || err.name === 'TrackStartError') {
                    Swal.fire({ icon: 'error', title: 'Kamera Sedang Digunakan', text: 'Tutup aplikasi lain yang menggunakan kamera.', background: 'rgba(30, 41, 59, 0.95)', color: '#fff', confirmButtonColor: '#ef4444' });
                } else {
                    Swal.fire({ icon: 'error', title: 'Error Kamera', text: err.message, background: 'rgba(30, 41, 59, 0.95)', color: '#fff', confirmButtonColor: '#ef4444' });
                }
            }
        }

        function openCameraUI() {
            const modal = document.getElementById('cameraModal');
            modal.classList.remove('hidden');
            void modal.offsetWidth;
            modal.classList.remove('opacity-0', 'pointer-events-none');
            videoElement.srcObject = cameraStream;
        }

        function closeCamera() {
            const modal = document.getElementById('cameraModal');
            modal.classList.add('opacity-0', 'pointer-events-none');
            setTimeout(() => { modal.classList.add('hidden'); }, 300);
            if (cameraStream) {
                cameraStream.getTracks().forEach(track => track.stop());
                cameraStream = null;
            }
            videoElement.srcObject = null;
        }

        function capturePhoto() {
            if (!cameraStream) return;
            const flash = document.getElementById('flashEffect');
            flash.classList.remove('animate-flash');
            void flash.offsetWidth;
            flash.classList.add('animate-flash');

            captureCanvas.width = videoElement.videoWidth;
            captureCanvas.height = videoElement.videoHeight;
            const captureCtx = captureCanvas.getContext('2d');
            captureCtx.drawImage(videoElement, 0, 0, captureCanvas.width, captureCanvas.height);
            const dataURL = captureCanvas.toDataURL('image/png');
            
            closeCamera();
            setTimeout(() => { processImage(dataURL); }, 300);
        }

        document.getElementById('btnTakePhoto').addEventListener('click', checkAndOpenCamera);
        document.getElementById('closeCamera').addEventListener('click', closeCamera);
        document.getElementById('shutterBtn').addEventListener('click', capturePhoto);

        // Process Image
        function processImage(src) {
            showLoading(true);
            image.src = src;
            image.onload = function() {
                hasImage = true;
                reset();
                draw();
                showLoading(false);
                updateUIState(); // Update tombol download
                
                Swal.fire({
                    icon: 'success', title: 'Foto Berhasil!', text: 'Geser & cubit untuk mengatur',
                    timer: 1500, showConfirmButton: false, background: 'rgba(30, 41, 59, 0.95)', color: '#fff'
                });
            };
        }

        // DOWNLOAD FUNCTION (BARU BRE!)
        downloadBtn.addEventListener('click', function() {
            if (!hasImage) {
                Swal.fire({
                    icon: 'warning', title: 'Belum Ada Foto', text: 'Silakan unggah atau ambil foto terlebih dahulu.',
                    background: 'rgba(30, 41, 59, 0.95)', color: '#fff', confirmButtonColor: '#f59e0b'
                });
                return;
            }

            showLoading(true);
            
            // Kasih delay dikit biar loading keliatan
            setTimeout(() => {
                try {
                    const dataURL = canvas.toDataURL('image/png');
                    const link = document.createElement('a');
                    link.download = 'Twibbon-SMKN1-LM.png';
                    link.href = dataURL;
                    link.click();
                    
                    showLoading(false);
                    Swal.fire({
                        icon: 'success', title: 'Download Berhasil!', text: 'Twibbon tersimpan di galeri Anda.',
                        timer: 2000, showConfirmButton: false, background: 'rgba(30, 41, 59, 0.95)', color: '#fff'
                    });
                } catch (err) {
                    showLoading(false);
                    Swal.fire({
                        icon: 'error', title: 'Gagal Download', text: 'Terjadi kesalahan saat menyimpan gambar.',
                        background: 'rgba(30, 41, 59, 0.95)', color: '#fff', confirmButtonColor: '#ef4444'
                    });
                }
            }, 500);
        });

        // Reset Posisi
        function reset() { scale = 1; position = { x: 0, y: 0 }; }

        // Draw Function
        function draw() {
            const cw = canvas.width;
            const ch = canvas.height;

            ctx.fillStyle = '#0f172a';
            ctx.fillRect(0, 0, cw, ch);

            if (hasImage && image.src && image.src !== window.location.href) {
                const iw = image.width;
                const ih = image.height;
                const scaleFactor = Math.min(cw / iw, ch / ih);
                
                ctx.save();
                ctx.translate(cw / 2, ch / 2);
                ctx.scale(scaleFactor * scale, scaleFactor * scale);
                ctx.translate(-iw / 2 + position.x / (scaleFactor * scale), -ih / 2 + position.y / (scaleFactor * scale));
                ctx.drawImage(image, 0, 0);
                ctx.restore();
            } else {
                ctx.fillStyle = '#1e293b';
                ctx.fillRect(0, 0, cw, ch);
                ctx.fillStyle = '#475569';
                ctx.font = 'bold 18px Poppins';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('Upload Foto Anda', cw / 2, ch / 2 - 20);
                ctx.font = '14px Poppins';
                ctx.fillStyle = '#64748b';
                ctx.fillText('Klik tombol di bawah', cw / 2, ch / 2 + 20);
            }
            ctx.drawImage(twibbon, 0, 0, cw, ch);
        }

        // Resize Canvas
        function resizeCanvas() {
            canvas.width = twibbon.width;
            canvas.height = twibbon.height;
            draw();
        }

        // Touch & Mouse Events
        function getEventPos(evt) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            if (evt.touches && evt.touches.length > 0) {
                return { x: (evt.touches[0].clientX - rect.left) * scaleX, y: (evt.touches[0].clientY - rect.top) * scaleY };
            }
            return { x: (evt.clientX - rect.left) * scaleX, y: (evt.clientY - rect.top) * scaleY };
        }

        function startDrag(evt) {
            if (!hasImage) return;
            isDragging = true;
            const pos = getEventPos(evt);
            dragStart = { x: pos.x - position.x, y: pos.y - position.y };
        }

        function doDrag(evt) {
            if (!isDragging || !dragStart || !hasImage) return;
            evt.preventDefault();
            const pos = getEventPos(evt);
            position.x = pos.x - dragStart.x;
            position.y = pos.y - dragStart.y;
            draw();
        }

        function endDrag() { isDragging = false; dragStart = null; }

        canvas.addEventListener('mousedown', startDrag);
        canvas.addEventListener('mousemove', doDrag);
        canvas.addEventListener('mouseup', endDrag);
        canvas.addEventListener('mouseleave', endDrag);
        canvas.addEventListener('touchstart', startDrag, { passive: false });
        canvas.addEventListener('touchmove', doDrag, { passive: false });
        canvas.addEventListener('touchend', endDrag);

        // Hammer.js untuk Pinch-to-Zoom
        const hammer = new Hammer(canvas);
        hammer.get('pinch').set({ enable: true });
        let initialScale = 1;
        hammer.on('pinchstart', () => { if (hasImage) initialScale = scale; });
        hammer.on('pinchmove', (evt) => {
            if (!hasImage) return;
            evt.preventDefault();
            scale = Math.max(0.1, Math.min(3, initialScale * evt.scale));
            draw();
        });

        // Initialize
        resizeCanvas();
        updateUIState();
    </script>
</body>
</html>
