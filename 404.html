<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 - Halaman Tidak Ditemukan</title>

<style>
:root{
    --bg:#ffffff;
    --text:#111827;
    --muted:#6b7280;
    --border:#e5e7eb;
    --button:#111827;
    --button-hover:#000000;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    padding:24px;
}

.container{
    width:100%;
    max-width:560px;
    text-align:center;
}

.code{
    font-size:6rem;
    font-weight:700;
    line-height:1;
    margin-bottom:12px;
    letter-spacing:-2px;
}

h1{
    font-size:1.75rem;
    font-weight:600;
    margin-bottom:12px;
}

p{
    color:var(--muted);
    line-height:1.7;
    margin-bottom:32px;
}

.actions{
    display:flex;
    justify-content:center;
    gap:12px;
    flex-wrap:wrap;
}

.btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    padding:12px 20px;
    border-radius:8px;
    text-decoration:none;
    font-size:14px;
    font-weight:500;
    transition:0.2s ease;
}

.btn-primary{
    background:var(--button);
    color:#fff;
}

.btn-primary:hover{
    background:var(--button-hover);
}

.btn-secondary{
    background:#fff;
    color:var(--text);
    border:1px solid var(--border);
}

.btn-secondary:hover{
    background:#f9fafb;
}

@media (max-width:768px){
    .code{
        font-size:4.5rem;
    }

    h1{
        font-size:1.5rem;
    }
}
</style>
</head>
<body>

<main class="container">
    <div class="code">404</div>

    <h1>Halaman Tidak Ditemukan</h1>

    <p>
        Maaf, halaman yang Anda cari tidak dapat ditemukan.
        Mungkin halaman telah dipindahkan, dihapus, atau alamat yang
        Anda masukkan tidak benar.
    </p>

    <div class="actions">
        <a href="/" class="btn btn-primary">Kembali ke Beranda</a>
        <a href="javascript:history.back()" class="btn btn-secondary">Halaman Sebelumnya</a>
    </div>
</main>

</body>
</html>
