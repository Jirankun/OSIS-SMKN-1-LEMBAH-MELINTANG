  <!-- ✅ Script: Update Open Graph Meta Tags berdasarkan ?file= -->
  <script>
    (function() {
      // Helper resolveImage - sama dengan config.js
      function resolveImage(path) {
        if (!path) return null;
        if (path.startsWith("http") || path.startsWith("//")) {
          return path;
        }
        const baseUrl = window.location.origin;
        if (path.startsWith("/")) {
          return baseUrl + path;
        }
        return baseUrl + "/" + path;
      }
      
      // Nilai OG Image dari config.js (heroBg)
      const CONFIG_HERO_BG = 'img/asset/super.jpeg';
      
      const params = new URLSearchParams(window.location.search);
      const fileParam = params.get('file');

      if (fileParam && fileParam.endsWith('.md')) {
        const safeFile = fileParam.replace(/[^a-zA-Z0-9._-]/g, '');
        
        fetch('../../post/' + safeFile)
          .then(res => res.ok ? res.text() : Promise.reject('Not found'))
          .then(text => {
            // Parse Frontmatter
            const match = text.match(/^---\s*\n([\s\S]*?)\n---\s*\n([\s\S]*)$/m);
            let frontmatter = {};
            if (match) {
              const yaml = match[1];
              yaml.split('\n').forEach(line => {
                const kv = line.match(/^(\w+):\s*(.*)/);
                if (kv) frontmatter[kv[1].toLowerCase()] = kv[2].trim().replace(/^["']|["']$/g, '');
              });
            }

            const title = frontmatter.title || 'Pengumuman OSIS';
            const descRaw = text.replace(/---[\s\S]*?---/, '').replace(/[#*`\[\]]/g, '').substring(0, 160).trim();
            const description = descRaw || frontmatter.description || 'Baca pengumuman lengkap dari OSIS SMKN 1 Lembah Melintang.';
            
            // IMAGE OG: Selalu ambil dari config.js (heroBg)
            const image = resolveImage(CONFIG_HERO_BG);

            // Update Meta Tags menggunakan fungsi dari config.js jika tersedia
            if (typeof updateOpenGraphTags === 'function') {
              updateOpenGraphTags(title, description, image);
            } else {
              // Fallback inline jika config.js belum load
              const setMeta = (property, content, name = null) => {
                let el = document.querySelector(`meta[property="${property}"]`) || 
                         document.querySelector(`meta[name="${name}"]`);
                if (!el) {
                  el = document.createElement('meta');
                  if (property) el.setAttribute('property', property);
                  if (name) el.setAttribute('name', name);
                  document.head.appendChild(el);
                }
                el.setAttribute('content', content);
              };
              setMeta('og:title', title);
              setMeta('og:description', description);
              setMeta('og:type', 'article');
              setMeta('og:image', image);
              setMeta('og:url', window.location.href);
              setMeta('twitter:card', 'summary_large_image', 'twitter:card');
              setMeta('twitter:title', title, 'twitter:title');
              setMeta('twitter:description', description, 'twitter:description');
              setMeta('twitter:image', image, 'twitter:image');
            }
            
            
          })
          .catch(err => {});
      }
    })();
  </script>
