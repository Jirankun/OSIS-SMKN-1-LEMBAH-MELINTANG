<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pengumuman - OSIS SMKN 1 LEMBAH MELINTANG</title>
  
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- ✅ CSS: Global dulu, baru page-specific -->
  <link rel="stylesheet" href="../../style/global/style.css">
  <link rel="stylesheet" href="../../style/pengumuman/style.css">
  
  <!-- ✅ Marked.js (load sebelum script pengumuman) -->
  <script src="https://cdn.jsdelivr.net/npm/marked@18.0.4/lib/marked.umd.min.js" defer></script>
  <script src="../../config.js" defer></script>
  <script src="../../script/pengumuman/script.js" defer></script>
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar" id="navbar">
    <div class="container navbar__inner">
      <a href="../../index.html" class="navbar__brand">
        <img src="../../img/asset/logo.webp" alt="Logo OSIS" class="navbar__logo">
        <div class="navbar__title">
          <span class="navbar__title-main">OSIS SMKN 1</span>
          <span class="navbar__title-sub">Lembah Melintang</span>
        </div>
      </a>
      <div class="navbar__links" id="navLinks"></div>
      <button class="navbar__hamburger" id="hamburger" aria-label="Toggle Menu">
        <span></span><span></span><span></span>
      </button>
    </div>
    <div class="navbar__mobile" id="mobileMenu"></div>
  </nav>

  <!-- PAGE HEADER -->
  <header class="page-header">
    <div class="container">
      <h1 class="page-header__title">Pengumuman</h1>
      <p class="page-header__subtitle">Informasi penting dan pengumuman dari OSIS SMKN 1 Lembah Melintang</p>
    </div>
  </header>

  <!-- SPLIT VIEW -->
  <section class="section pt-0">
    <div class="container">
      <div class="pengumuman-split">
        
        <!-- LEFT: Content Viewer -->
        <div class="pengumuman-content" id="pengumumanContent">
          <div class="content-placeholder">
            <i class="fa-solid fa-bullhorn" style="font-size:3rem;color:var(--gray-300);margin-bottom:1rem"></i>
            <p style="color:var(--gray-500)">Pilih pengumuman untuk membaca...</p>
          </div>
        </div>

        <!-- RIGHT: List Sidebar -->
        <aside class="pengumuman-sidebar">
          <div class="search-bar" style="margin-bottom:1.5rem">
            <i class="fa-solid fa-magnifying-glass search-bar__icon"></i>
            <input type="text" id="pengumumanSearch" placeholder="Cari pengumuman...">
          </div>
          <div class="pengumuman-list" id="pengumumanList"></div>
        </aside>

      </div>
    </div>
  </section>

  <!-- FOOTER -->
  <footer class="footer">
    <div class="container footer__grid">
      <div>
        <img src="../../img/asset/logo.webp" alt="Logo OSIS" class="footer__brand-logo">
        <h3 class="footer__brand-name" id="footerBrand"></h3>
        <p class="footer__brand-desc" id="footerDesc"></p>
      </div>
      <div>
        <h4 class="footer__heading">Navigasi Cepat</h4>
        <ul class="footer__links" id="footerLinks"></ul>
      </div>
    </div>
    <div class="container footer__bottom">
      <span>&copy; <span id="year"></span> OSIS SMKN 1 LM. All rights reserved.</span>
    </div>
  </footer>

  <!-- BACK TO TOP -->
  <button id="backToTop" class="btn btn-primary" style="position:fixed;bottom:1.5rem;right:1.5rem;width:48px;height:48px;border-radius:50%;display:none;align-items:center;justify-content:center;padding:0;z-index:999;box-shadow:var(--shadow-lg)">
    <i class="fa-solid fa-arrow-up"></i>
  </button>

      <!-- Embed Script Darkmode.js dari jsDelivr -->
<script src="https://cdn.jsdelivr.net/npm/darkmode-js@1.5.7/lib/darkmode-js.min.js"></script>

<script>
  function addDarkmodeWidget() {
    new Darkmode({
      bottom: '77px',          // Posisi dari bawah layar
      right: '25px',           // Posisi dari kanan layar
      time: '0.9s',            // Durasi animasi transisi warna
      mixColor: '#FFFFFF',        // Warna dasar efek inversi
      backgroundColor: '#FFFFFF', // Warna background asli website Anda
      buttonColorDark: '#000000', // Warna tombol saat mode gelap
      buttonColorLight: '#727272',   // Warna tombol saat mode terang
      saveInCookies: true,     // Mengingat pilihan user saat ganti halaman
      label: '🌓',             // Ikon di dalam tombol widget
      autoMatchOsTheme: true   // Otomatis aktif jika OS user memakai dark mode
    }).showWidget();
  }
  
  // Jalankan fungsi setelah seluruh halaman selesai dimuat
  window.addEventListener('load', addDarkmodeWidget);
</script>



  <script src="../../script/cookie-toast.js" defer></script>
  <script src="../../script/notification.js" defer></script>
</body>
</html>
