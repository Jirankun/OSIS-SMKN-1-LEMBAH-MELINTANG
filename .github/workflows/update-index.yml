name: Update Posts Index

on:
  push:
    branches: [main]
    paths:
      - 'post/**'

jobs:
  update-index:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate posts index
        run: python3 .github/workflows/generate_index.py

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/posts-index.json
          git diff --staged --quiet || git commit -m "chore: update posts-index.json"
          git push
