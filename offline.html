<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - OSIS SMKN 1 Lembah Melintang</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 50%, #0f172a 100%);
      color: #e2e8f0;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      -webkit-text-size-adjust: 100%;
    }
    .offline-card {
      text-align: center;
      max-width: 420px;
      width: 100%;
    }
    .offline-icon {
      font-size: 4rem;
      margin-bottom: 1.5rem;
      display: block;
    }
    .offline-title {
      font-size: clamp(1.5rem, 5vw, 2rem);
      font-weight: 700;
      color: #f1f5f9;
      margin-bottom: 0.75rem;
      line-height: 1.2;
    }
    .offline-desc {
      font-size: 0.95rem;
      color: #94a3b8;
      line-height: 1.7;
      margin-bottom: 2rem;
    }
    .offline-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.85rem 2rem;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 700;
      color: #fff;
      background: #0ea5e9;
      text-decoration: none;
      transition: all 0.25s ease;
      box-shadow: 0 4px 15px rgba(14,165,233,0.4);
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .offline-btn:hover {
      background: #0284c7;
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(14,165,233,0.5);
    }
    .offline-btn:active {
      transform: translateY(0);
    }
    @media (prefers-reduced-motion: reduce) {
      .offline-btn { transition: none; }
    }
  </style>
</head>
<body>
  <div class="offline-card">
    <span class="offline-icon">📡</span>
    <h1 class="offline-title">Koneksi Terputus</h1>
    <p class="offline-desc">
      Sepertinya kamu sedang offline. Beberapa konten mungkin tidak tersedia.
      <br><br>
      Halaman yang sudah pernah dikunjungi sebelumnya tetap bisa diakses.
    </p>
    <a href="/" class="offline-btn" onclick="window.location.href='/'">
      <span>&larr;</span> Coba Lagi
    </a>
  </div>
</body>
</html>
