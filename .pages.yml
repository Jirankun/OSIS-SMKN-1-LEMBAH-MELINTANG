media:
  input: img
  output: img
content:
  # ============================================
  # KOLEKSI POSTS
  # ============================================
  - name: posts
    label: "Artikel & Pengumuman"
    type: collection
    path: post
    filename: "{year}-{month}-{day}-{fields.title}-{fields.type}-{fields.author}.md"
    fields:
      - name: title
        label: "Judul"
        type: string
        required: true
      - name: type
        label: "Tipe Konten"
        required: true
        type: select
        options:
          values: [berita, pengumuman, agenda]
        default: berita
      - { name: date, label: "Tanggal Publikasi", type: date, required: true }
      - { name: author, label: "Penulis", type: string, required: true }
      - name: image
        label: "Thumbnail Gambar"
        type: image
        required: false
        options:
          input: img/post
          output: img/post
      - name: video_url
        label: "Link Video (Opsional)"
        type: string
        required: false
        pattern: "^(?!.*(youtube\\.com|youtu\\.be)).*$"
        description: "Khusus tipe Agenda: link YouTube tidak diizinkan. Gunakan platform lain (Google Drive, Vimeo, dll)."
      - { name: body, label: "Isi Konten", type: rich-text, required: true }

  # ============================================
  # GALERI KEGIATAN
  # ============================================
  - name: galeri
    label: "Galeri Kegiatan"
    type: file
    path: content/galeri.json
    list: true
    fields:
      - { name: title, label: "Judul Foto", type: string, required: true }
      - { name: date, label: "Tanggal Kegiatan", type: date, required: true }
      - { name: description, label: "Keterangan", type: string, required: false }
      - name: image
        label: "Upload Foto"
        type: image
        required: true
        options:
          input: img/galeri
          output: img/galeri

  # ============================================
  # PENGURUS INTI OSIS
  # ============================================
  - name: pengurus_inti
    label: "Pengurus Inti OSIS"
    type: file
    path: content/team_1.json
    list: true
    fields:
      - { name: name, label: "Nama Lengkap", type: string, required: true }
      - { name: role, label: "Jabatan", type: string, required: true }
      - name: image
        label: "Foto Profil"
        type: image
        required: true
        options:
          input: img/pengurus/inti
          output: img/pengurus/inti

  # ============================================
  # STRUKTUR DIVISI OSIS
  # ============================================
  - name: pengurus_divisi
    label: "Struktur Divisi OSIS"
    type: file
    path: content/team_2.json
    list: true
    fields:
      - { name: division, label: "Nama Divisi", type: string, required: true }
      - name: members
        label: "Anggota Divisi"
        type: object
        list: true
        fields:
          - { name: name, label: "Nama Anggota", type: string, required: true }
          - name: image
            label: "Foto Anggota"
            type: image
            required: false
            options:
              input: img/pengurus/divisi
              output: img/pengurus/divisi

  # ============================================
  # UJIAN TES
  # ============================================
  - name: ujian_tes
    label: "Ujian Tes"
    type: file
    path: content/ujian_tes.json
    fields:
      - { name: status, label: "Status", type: boolean, required: false, description: "Jika dinyalakan, Popup ujian akan muncul di home."}
      - { name: title, label: "Judul Ujian", type: string, required: true }
      - { name: start_date, label: "Mulai Tanggal", type: date, required: true }
      - { name: end_date, label: "Sampai Tanggal", type: date, required: true }
      - name: link
        label: "Link Google Form"
        type: string
        required: true
        description: "Masukkan link Google Form untuk ujian ini."
