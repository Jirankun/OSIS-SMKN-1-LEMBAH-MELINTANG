media: img

content:
  - name: posts
    label: Artikel & Pengumuman
    type: collection
    path: post
    fields:
      - { name: title, label: Judul, type: string }
      - name: type
        label: Tipe
        type: select
        options:
          - berita
          - pengumuman
          - agenda
      - { name: date, label: Tanggal, type: date }
      - { name: author, label: Penulis, type: string }
      - { name: image, label: Thumbnail, type: image, required: false }
      - { name: body, label: Konten, type: rich-text }

  - name: galeri
    label: Galeri Kegiatan
    type: file
    path: content/galeri.json
    fields:
      - name: galeri
        label: Daftar Foto
        type: object
        list: true
        fields:
          - { name: title, label: Judul, type: string }
          - { name: date, label: Tanggal, type: date }
          - { name: description, label: Keterangan, type: string }
          - { name: image, label: Foto, type: image }

  - name: pengurus_inti
    label: Pengurus Inti
    type: file
    path: content/team_1.json
    fields:
      - name: team
        label: Anggota Inti
        type: object
        list: true
        fields:
          - { name: name, label: Nama, type: string }
          - { name: role, label: Jabatan, type: string }
          - { name: image, label: Foto, type: image }

  - name: pengurus_divisi
    label: Divisi OSIS
    type: file
    path: content/team_2.json
    fields:
      - name: divisions
        label: Struktur Divisi
        type: object
        list: true
        fields:
          - { name: division, label: Nama Divisi, type: string }
          - name: members
            label: Anggota
            type: object
            list: true
            fields:
              - { name: name, label: Nama, type: string }
              - { name: image, label: Foto, type: image }
