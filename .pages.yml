media:
  input: img
  output: img
content:
  # ============================================
  # KOLEKSI POSTS
  # ============================================
  - name: posts
    label: "Artikel & Pengumuman"
    type: collection
    path: post
    filename: "{year}-{month}-{day}-{fields.title}-{fields.type}-{fields.author}.md"
    fields:
      - name: title
        label: "Judul"
        type: string
        required: true
        pattern: "^.{1,30}$"
        description: "Maksimal 30 karakter (digunakan sebagai nama file)"
      - name: type
        label: "Tipe Konten"
        required: true
        type: select
        options:
          values: [berita, pengumuman, agenda]
        default: berita
      - { name: date, label: "Tanggal Publikasi", type: date, required: true }
      - { name: author, label: "Penulis", type: string, required: true }
      - name: image
        label: "Thumbnail Gambar"
        type: image
        required: false
        options:
          input: img/post
          output: img/post
      - { name: body, label: "Isi Konten", type: rich-text, required: true }
  # ============================================
  # GALERI KEGIATAN
  # ============================================
  - name: galeri
    label: "Galeri Kegiatan"
    type: file
    path: content/galeri.json
    list: true
    fields:
      - { name: title, label: "Judul Foto", type: string, required: true }
      - { name: date, label: "Tanggal Kegiatan", type: date, required: true }
      - { name: description, label: "Keterangan", type: string, required: false }
      - name: image
        label: "Upload Foto"
        type: image
        required: true
        options:
          input: img/galeri
          output: img/galeri
  # ============================================
  # PENGURUS INTI OSIS
  # ============================================
  - name: pengurus_inti
    label: "Pengurus Inti OSIS"
    type: file
    path: content/team_1.json
    list: true
    fields:
      - { name: name, label: "Nama Lengkap", type: string, required: true }
      - { name: role, label: "Jabatan", type: string, required: true }
      - name: image
        label: "Foto Profil"
        type: image
        required: true
        options:
          input: img/pengurus/inti
          output: img/pengurus/inti
  # ============================================
  # STRUKTUR DIVISI OSIS
  # ============================================
  - name: pengurus_divisi
    label: "Struktur Divisi OSIS"
    type: file
    path: content/team_2.json
    list: true
    fields:
      - { name: division, label: "Nama Divisi", type: string, required: true }
      - name: members
        label: "Anggota Divisi"
        type: object
        list: true
        fields:
          - { name: name, label: "Nama Anggota", type: string, required: true }
          - name: image
            label: "Foto Anggota"
            type: image
            required: false
            options:
              input: img/pengurus/divisi
              output: img/pengurus/divisi
# ============================================
  # NOTIFIKASI POPUP 🔔
  # ============================================
  - name: notifications
    label: "Notifikasi Popup"
    type: file
    path: content/notifications.json
    list: true
    fields:
      - name: title
        label: "Judul Notifikasi"
        type: string
        required: true
        description: "Judul singkat yang muncul di popup"
      
      - name: message
        label: "Pesan"
        type: text
        required: true
        description: "Isi pesan notifikasi"
      
      - name: type
        label: "Tipe Notifikasi"
        type: select
        required: true
        options:
          values: [info, warning]
        default: info
        description: "Info = informasi biasa | Warning = peringatan penting"
      
      - name: active
        label: "Aktif"
        type: boolean
        default: false
        description: "⚠️ HANYA AKTIFKAN 1 NOTIFIKASI! Matikan yang lain jika ingin ganti."
      
      - name: show_from
        label: "Tampilkan Mulai"
        type: date
        required: true
        description: "Notifikasi mulai muncul sejak tanggal ini"
      
      - name: show_until
        label: "Tampilkan Sampai"
        type: date
        required: true
        description: "Batas waktu notifikasi berakhir"
      
      - name: link
        label: "Link Tujuan"
        type: string
        required: false
        description: "URL ketika popup diklik (opsional)"
      
      - name: link_text
        label: "Teks Tombol"
        type: string
        required: false
        default: "Lihat Detail"
        description: "Label tombol di popup"
